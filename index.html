<!---Code for a game where you use your hands to charge up a purple energy orb (Gojo's Hollow Purple) and then blast it at your opponent--->

<!DOCTYPE html>
<html>
<head>

<title>Gojo's Hollow Purple</title>

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>

<style>

body{
margin:0;
overflow:hidden;
background:black;
}

canvas{
position:absolute;
width:100%;
height:100%;
transform:scaleX(-1);
}

video{
display:none;
}

</style>
</head>

<body>

<video id="video"></video>
<canvas id="canvas"></canvas>

<script>

let charging = false;
let charged = false;
let firing = false;
let beamLength = 0;
let purpleX = 0;
let purpleY = 0;
let prevZ = null;
let pushVelocity = 0;
const video=document.getElementById("video");
const canvas=document.getElementById("canvas");
const ctx=canvas.getContext("2d");

let leftOrb=null;
let rightOrb=null;

let purpleCharge=0;
let explosion=0;

let particles=[];

const chargeSound=new Audio("sound/charge.mp3");
const blastSound=new Audio("sound/blast.mp3");

function onResults(results){

canvas.width=window.innerWidth;
canvas.height=window.innerHeight;

ctx.drawImage(results.image,0,0,canvas.width,canvas.height);

leftOrb=null;
rightOrb=null;

if(results.multiHandLandmarks){

for(let i=0;i<results.multiHandLandmarks.length;i++){

let lm=results.multiHandLandmarks[i];
let type=results.multiHandedness[i].label;

let finger=lm[8];

let x = finger.x * canvas.width;
let y = finger.y * canvas.height;
let z = finger.z;
if(type==="Left") leftOrb={x,y};
if(type==="Right") rightOrb={x,y};
if(prevZ !== null){

pushVelocity = prevZ - z;
drawPurpleBeam();

}

prevZ = z;
}

}

drawEnergy();
updateParticles();

}

function drawEnergy(){

if(leftOrb){

drawAura(leftOrb,"blue");
spawnParticles(leftOrb,"blue");

}

function releasePurpleBeam(){

if(!charged) return;
firing = true;
beamLength = 0;

}

if(rightOrb){
drawAura(rightOrb,"red");
spawnParticles(rightOrb,"red");
}

if(leftOrb && rightOrb){

let dx=leftOrb.x-rightOrb.x;
let dy=leftOrb.y-rightOrb.y;

let dist=Math.sqrt(dx*dx+dy*dy);

if(dist<150){

purpleCharge+=1;

chargeSound.play();

let cx=(leftOrb.x+rightOrb.x)/2;
let cy=(leftOrb.y+rightOrb.y)/2;

drawPurpleCharge(cx,cy);



if(purpleCharge>30){
charged = true;
let jitter = (Math.random()-0.5)*20;
let jitter2 = (Math.random()-0.5)*20;
ctx.lineTo(cx + jitter, cy + jitter2);
purpleX = cx;
purpleY = cy;

triggerExplosion(cx,cy);

}

}else{

purpleCharge=0;

}

}



}

function drawAura(pos,color){
let radius=40+Math.sin(Date.now()*0.01)*10;
ctx.beginPath();
ctx.arc(pos.x,pos.y,radius,0,Math.PI*2);
if(color==="blue"){
ctx.fillStyle="rgba(0,150,255,0.7)";
ctx.shadowColor="#00aaff";
}

if(color==="red"){
ctx.fillStyle="rgba(255,60,60,0.7)";
ctx.shadowColor="#ff0033";

}

ctx.shadowBlur=40;

ctx.fill();

}

function drawPurpleBeam(){

if(!firing) return;

beamLength += 60;

ctx.beginPath();
ctx.moveTo(purpleX,purpleY);
ctx.lineTo(purpleX,purpleY - beamLength);

ctx.lineWidth = 40;
ctx.strokeStyle = "rgba(200,0,255,0.9)";
ctx.shadowColor = "#bb00ff";
ctx.shadowBlur = 80;

ctx.stroke();

if(beamLength > canvas.height){

resetAttack();

}

}

function drawPurpleCharge(x,y){

let r=60+purpleCharge*2;

ctx.beginPath();
ctx.arc(x,y,r,0,Math.PI*2);

ctx.fillStyle="rgba(180,0,255,0.9)";
ctx.shadowColor="#bb00ff";
ctx.shadowBlur=60;

ctx.fill();

}

if(charged && pushVelocity > 0.15){

releasePurpleBeam();

}

function triggerExplosion(x,y){

blastSound.play();

explosion=20;

ctx.beginPath();
ctx.arc(x,y,120,0,Math.PI*2);

ctx.fillStyle="rgba(200,0,255,0.9)";
ctx.shadowBlur=100;
ctx.fill();

screenShake();

}

function spawnParticles(pos,color){
for(let i=0;i<2;i++){
particles.push({
x:pos.x,
y:pos.y,
vx:(Math.random()-0.5)*4,
vy:(Math.random()-0.5)*4,
life:30,
color:color

});

}

}

function updateParticles(){

for(let i=particles.length-1;i>=0;i--){
let p=particles[i];
p.x+=p.vx;
p.y+=p.vy;
p.life--;
ctx.beginPath();
ctx.arc(p.x,p.y,4,0,Math.PI*2);

if(p.color==="blue") ctx.fillStyle="#00aaff";
if(p.color==="red") ctx.fillStyle="#ff0033";

ctx.fill();

if(p.life<=0){

particles.splice(i,1);

}

}

}

function screenShake(){

let shake=10;
canvas.style.transform=
`translate(${(Math.random()-0.5)*shake}px,
${(Math.random()-0.5)*shake}px) scaleX(-1)`;
setTimeout(()=>{
canvas.style.transform="scaleX(-1)";
},100);

}

const hands=new Hands({

locateFile:(file)=>{

return `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`;

}

});

hands.setOptions({

maxNumHands:2,
modelComplexity:1,
minDetectionConfidence:0.5,
minTrackingConfidence:0.5

});

hands.onResults(onResults);
const camera=new Camera(video,{
onFrame:async()=>{
await hands.send({image:video});

},

width:1280,
height:720

});


window.addEventListener("keydown",function(e){

if(e.code === "Space"){

releasePurpleBeam();

}

});

function resetAttack(){

firing = false;
charged = false;
charging = false;
purpleCharge = 0;
beamLength = 0;

}

camera.start();
console.log(pushVelocity);
</script>

</body>
</html>
