<!DOCTYPE html>
<html>
<head>
<title>Gojo's Hollow Purple</title>

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>

<style>
body{
margin:0;
overflow:hidden;
background:black;
}

canvas{
position:absolute;
width:100%;
height:100%;
transform:scaleX(-1);
}

video{
display:none;
}
</style>

</head>

<body>

<video id="video"></video>
<canvas id="canvas"></canvas>

<script>

const video = document.getElementById("video");
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

let leftOrb = null;
let rightOrb = null;
let purplePower = 0;

function onResults(results){

canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

ctx.clearRect(0,0,canvas.width,canvas.height);

leftOrb = null;
rightOrb = null;

if(results.multiHandLandmarks){

for(let i=0;i<results.multiHandLandmarks.length;i++){

let hand = results.multiHandLandmarks[i];
let type = results.multiHandedness[i].label;

let finger = hand[8];

let x = finger.x * canvas.width;
let y = finger.y * canvas.height;

if(type==="Left"){
leftOrb={x,y};
}

if(type==="Right"){
rightOrb={x,y};
}

}

}

drawEnergy();

}

function drawEnergy(){

if(leftOrb){

ctx.beginPath();
ctx.arc(leftOrb.x,leftOrb.y,40,0,Math.PI*2);

ctx.fillStyle="rgba(0,150,255,0.8)";
ctx.shadowColor="#00aaff";
ctx.shadowBlur=40;

ctx.fill();

}

if(rightOrb){

ctx.beginPath();
ctx.arc(rightOrb.x,rightOrb.y,40,0,Math.PI*2);

ctx.fillStyle="rgba(255,60,60,0.8)";
ctx.shadowColor="#ff0033";
ctx.shadowBlur=40;

ctx.fill();

}

if(leftOrb && rightOrb){

let dx=leftOrb.x-rightOrb.x;
let dy=leftOrb.y-rightOrb.y;

let distance=Math.sqrt(dx*dx+dy*dy);

if(distance<120){

purplePower+=15;

let cx=(leftOrb.x+rightOrb.x)/2;
let cy=(leftOrb.y+rightOrb.y)/2;

ctx.beginPath();
ctx.arc(cx,cy,60,0,Math.PI*2);

ctx.fillStyle="rgba(180,0,255,0.9)";
ctx.shadowColor="#bb00ff";
ctx.shadowBlur=60;

ctx.fill();

ctx.beginPath();
ctx.moveTo(cx,cy);
ctx.lineTo(cx,cy-purplePower);

ctx.lineWidth=25;
ctx.strokeStyle="purple";
ctx.stroke();

}

else{

purplePower=0;

}

}

}

const hands = new Hands({
locateFile:(file)=>{
return `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`;
}
});

hands.setOptions({
maxNumHands:2,
modelComplexity:1,
minDetectionConfidence:0.5,
minTrackingConfidence:0.5
});

hands.onResults(onResults);

const camera = new Camera(video,{
onFrame: async()=>{
await hands.send({image:video});
},
width:1280,
height:720
});

camera.start();

</script>

</body>
</html>
